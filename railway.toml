[build]
builder = "NIXPACKS"
buildCommand = "npm install && npx prisma generate && npx next build"

[deploy]
startCommand = "npx prisma db push && (npx tsx prisma/seed-if-empty.ts || true) && npx next start --hostname 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
